name: Auto-format

# Manual only: runs the pinned formatters and commits any changes back to the branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Black (pinned)
        run: |
          python -m pip install "black==26.5.1"
          python -m black .
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: ktlint format (pinned plugin)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon ktlintFormat || true
          ./gradlew --no-daemon ktlintCheck
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then echo "No formatting changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: apply black and ktlint formatting"
          git push
