name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relay_ci
          POSTGRES_PASSWORD: disposable-ci-only-password
          POSTGRES_DB: relay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay_ci -d relay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://relay_ci:disposable-ci-only-password@127.0.0.1:5432/relay_test
      TEST_POSTGRES_URL: postgresql+asyncpg://relay_ci:disposable-ci-only-password@127.0.0.1:5432/relay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate per-run test signing secret
        run: python -c 'import os,secrets; open(os.environ["GITHUB_ENV"], "a").write("JWT_SECRET=" + secrets.token_hex(32) + "\n")'
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Lint
        run: python -m ruff check .
      - name: Formatting
        shell: bash
        run: |
          set +e
          python -m black --check . 2>&1 | tee black.log
          status=${PIPESTATUS[0]}
          grep -E "would reformat" black.log | sed 's/^/::error title=black::/'
          exit $status
      - name: Type checks
        run: python -m mypy src
      - name: Verify operator frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
      - name: Verify PostgreSQL migrations on the disposable CI database
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Tests including PostgreSQL integration
        shell: bash
        run: |
          set +e
          python -m pytest 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR) " pytest.log | head -30 | sed 's/^/::error title=pytest::/'
          grep -E "^E   " pytest.log | head -20 | sed 's/^/::error title=pytest-detail::/'
          tail -1 pytest.log | sed 's/^/::notice title=pytest-summary::/'
          exit $status

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify Android agent
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon ktlintCheck testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease 2>&1 | tee gradle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -A12 "What went wrong" gradle.log | head -40 | tr '\n' ' ' | sed 's/^/::error title=gradle::/'
            echo
            grep -E "^e: |FAILED|Lint found|\.kt:[0-9]+:[0-9]+" gradle.log | head -20 | sed 's/^/::error title=gradle-detail::/'
          fi
          exit $status
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest
