name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relay_ci
          POSTGRES_PASSWORD: disposable-ci-only-password
          POSTGRES_DB: relay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay_ci -d relay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://relay_ci:disposable-ci-only-password@127.0.0.1:5432/relay_test
      TEST_POSTGRES_URL: postgresql+asyncpg://relay_ci:disposable-ci-only-password@127.0.0.1:5432/relay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate per-run test signing secret
        run: python -c 'import os,secrets; open(os.environ["GITHUB_ENV"], "a").write("JWT_SECRET=" + secrets.token_hex(32) + "\n")'
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Lint
        run: python -m ruff check --output-format=github .
      - name: Formatting
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          python -m black --check . 2>&1 | tee black.log
          status=${PIPESTATUS[0]}
          grep -E "would reformat" black.log | sed 's/^/::error title=black::/'
          exit $status
      - name: Type checks
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          python -m mypy src 2>&1 | tee mypy.log
          status=${PIPESTATUS[0]}
          grep -E "^[^:]+:[0-9]+: error:" mypy.log | head -30 | sed 's/^/::error title=mypy::/'
          exit $status
      - name: Verify operator frontend
        id: frontend
        if: ${{ !cancelled() }}
        working-directory: frontend
        shell: bash
        env:
          NO_COLOR: "1"
        run: |
          npm ci
          set +e
          npm test 2>&1 | tee vitest.log
          status=${PIPESTATUS[0]}
          grep -E "FAIL |AssertionError|TestingLibraryElementError|Unable to find|Error: |expected " vitest.log | grep -v "^ *at " | head -9 | sed 's/^ */::error title=vitest::/'
          [ "$status" -eq 0 ] || exit "$status"
          set -e
          npm run lint
          npm run build
      - name: Keep the built operator console for visual review
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' && github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: operator-dist
          path: frontend/dist
          retention-days: 3
      - name: Verify PostgreSQL migrations on the disposable CI database
        if: ${{ !cancelled() }}
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Tests including PostgreSQL integration
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          python -m pytest 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR) " pytest.log | head -30 | sed 's/^/::error title=pytest::/'
          grep -E "^E   " pytest.log | head -20 | sed 's/^/::error title=pytest-detail::/'
          grep -E "(Error|Exception)(:| )|Traceback|File \"/home/runner/work/Relay/Relay/src|^src/relay/.*: in |^[a-z_/]+\\.py:[0-9]+: " pytest.log | grep -v "^E   " | head -40 | sed 's/^/::error title=pytest-trace::/'
          tail -1 pytest.log | sed 's/^/::notice title=pytest-summary::/'
          exit $status

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify Android agent
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon ktlintCheck testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease 2>&1 | tee gradle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -A12 "What went wrong" gradle.log | head -40 | tr '\n' ' ' | sed 's/^/::error title=gradle::/'
            echo
            python3 - <<'PY'
          import glob, pathlib
          log = pathlib.Path("gradle.log").read_text(errors="ignore").splitlines()
          for i, line in enumerate(log):
              if "First failure" in line or ": Error: " in line:
                  print("::error title=lint-text::" + " | ".join(l.strip() for l in log[i:i + 6]))
          for f in glob.glob("app/build/reports/ktlint/**/*.txt", recursive=True):
              for l in pathlib.Path(f).read_text(errors="ignore").splitlines():
                  if l.strip():
                      print("::error title=ktlint::" + l.strip()[:400])
          for f in glob.glob("app/build/reports/lint-results-*.txt") + glob.glob("app/build/reports/lint-results-*.xml"):
              print("::notice title=lint-report::" + f)
              for l in pathlib.Path(f).read_text(errors="ignore").splitlines():
                  if "Error" in l or 'severity="Error"' in l:
                      print("::error title=lint-report-line::" + l.strip()[:400])
          PY
            grep -E "^e: |FAILED|Lint found|\.kt:[0-9]+:[0-9]+" gradle.log | head -20 | sed 's/^/::error title=gradle-detail::/'
          fi
          exit $status
      - name: Enable KVM for the Android emulator
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation tests
        # Manual runs only: the hosted emulator often fails to boot (Oct 2026)
        # and held every push for ~15 minutes. Build, unit tests and lint gate.
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest
