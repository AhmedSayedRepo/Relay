name: Android screenshots

# Renders the agent screen under Robolectric (no emulator) and commits the PNGs
# to android/screenshots/ on the same branch for design review.
on:
  workflow_dispatch:
  push:
    branches: ["feature/android-**"]
    paths: ["android/**", ".github/workflows/android-screenshots.yml"]

permissions:
  contents: write

concurrency:
  group: android-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Render screenshots
        working-directory: android
        run: |
          set +e
          chmod +x gradlew
          ./gradlew --no-daemon -Pscreenshots :app:testFullDebugUnitTest --tests '*AgentScreenScreenshotTest*' 2>&1 | tee render.log
          status=${PIPESTATUS[0]}
          grep -E "^e: |error:" render.log | head -5 | while IFS= read -r line; do
            echo "::error title=screenshots::${line}"
          done
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for failure in list(case.iter("failure")) + list(case.iter("error")):
                      message = (failure.get("message") or failure.text or "").splitlines()[:3]
                      print(f"::error title=screenshot-test {case.get('name')}::{' | '.join(message)[:900]}")
          PY
          echo "status=$status" >> "$GITHUB_ENV"
      - name: Commit screenshots
        if: ${{ !cancelled() }}
        run: |
          mkdir -p android/screenshots
          if ls android/app/build/screenshots/*.png >/dev/null 2>&1; then
            cp android/app/build/screenshots/*.png android/screenshots/
          fi
          git add android/screenshots
          if git diff --cached --quiet; then echo "No screenshot changes"; else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Android screenshots"
            git push
          fi
      - name: Report test result
        if: ${{ !cancelled() }}
        run: exit "${status:-1}"
