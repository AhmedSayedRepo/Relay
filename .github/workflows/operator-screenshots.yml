name: Operator screenshots

# Builds the operator console, renders key screens against mocked synthetic
# API data with Playwright, and commits the PNGs to frontend/screenshots/.
on:
  workflow_dispatch:
  push:
    branches: ["feature/operator-**"]
    paths: ["frontend/**", ".github/workflows/operator-screenshots.yml"]

permissions:
  contents: write

concurrency:
  group: operator-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and render
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          node scripts/console-shots.cjs dist screenshots
      - name: Commit screenshots
        run: |
          git add frontend/screenshots
          if git diff --cached --quiet; then echo "No screenshot changes"; else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update operator screenshots"
            git push
          fi
