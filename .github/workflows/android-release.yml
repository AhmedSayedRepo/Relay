name: Android release

# Builds the signed Relay APKs and publishes them as a GitHub Release. Each
# app can be released on its own: Relay Receipts, Relay Bank SMS (full flavor)
# and Relay Operator. Start it from release.bat, manually with a version and
# the apps, or by pushing a tag:
#   agent-v0.9.0                      Receipts + Operator
#   agent-v0.9.0-bank                 Receipts + Operator + Bank SMS
#   agent-v0.9.0-only-operator        only the listed apps (any of receipts,
#   agent-v0.9.0-only-receipts-bank   bank, operator)
on:
  push:
    tags: ["agent-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, e.g. 0.5.0"
        required: true
      apps:
        description: "Apps to release, comma separated: receipts, bank, operator"
        default: "receipts,operator"
      bank_sms:
        description: "Also release Relay Bank SMS (older way of asking)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      APPS_INPUT: ${{ inputs.apps }}
      BANK_INPUT: ${{ inputs.bank_sms && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release settings
        env:
          KEYSTORE: ${{ secrets.RELAY_KEYSTORE_BASE64 }}
          BASE_URL: ${{ vars.RELAY_BASE_URL }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing secret RELAY_KEYSTORE_BASE64;"
          [ -n "$BASE_URL" ] || missing="$missing variable RELAY_BASE_URL;"
          if [ -n "$missing" ]; then
            echo "::error title=release-settings::Missing:$missing see docs/android-release.md"
            exit 1
          fi
          case "$BASE_URL" in https://*/) ;; *)
            echo "::error title=release-settings::RELAY_BASE_URL must be an https origin ending with /"
            exit 1 ;;
          esac
      - name: Choose the apps
        run: |
          set -euo pipefail
          raw="${VERSION#agent-v}"
          version="${raw%%-*}"
          suffix=""; [ "$raw" != "$version" ] && suffix="-${raw#*-}-"
          if [ -n "${APPS_INPUT:-}" ]; then
            apps=",${APPS_INPUT// /},"
          elif [[ "$suffix" == *-only-* ]]; then
            apps=",${suffix//-/,},"
          else
            apps=",receipts,operator,"
            [[ "$suffix" == *-bank-* ]] && apps="${apps}bank,"
          fi
          [ "${BANK_INPUT:-false}" = true ] && apps="${apps}bank,"
          receipts=false; bank=false; operator=false
          [[ "$apps" == *,receipts,* ]] && receipts=true
          [[ "$apps" == *,bank,* ]] && bank=true
          [[ "$apps" == *,operator,* ]] && operator=true
          if [ "$receipts$bank$operator" = falsefalsefalse ]; then
            echo "::error title=release-apps::No app chosen. Use receipts, bank or operator."
            exit 1
          fi
          {
            echo "APP_VERSION=$version"
            echo "RECEIPTS=$receipts"
            echo "BANK_SMS=$bank"
            echo "OPERATOR=$operator"
          } >> "$GITHUB_ENV"
          echo "::notice title=release-apps::$version: receipts=$receipts bank=$bank operator=$operator"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build signed APKs
        working-directory: android
        env:
          RELAY_KEYSTORE_BASE64: ${{ secrets.RELAY_KEYSTORE_BASE64 }}
          RELAY_KEYSTORE_PASSWORD: ${{ secrets.RELAY_KEYSTORE_PASSWORD }}
          RELAY_KEY_ALIAS: ${{ secrets.RELAY_KEY_ALIAS }}
          RELAY_KEY_PASSWORD: ${{ secrets.RELAY_KEY_PASSWORD }}
          RELAY_BASE_URL: ${{ vars.RELAY_BASE_URL }}
        run: |
          set -euo pipefail
          version="$APP_VERSION"
          export RELAY_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          printf '%s' "$RELAY_KEYSTORE_BASE64" | base64 --decode > "$RELAY_KEYSTORE_FILE"
          chmod +x gradlew
          tasks=(); flavors=""
          [ "$RECEIPTS" = true ] && tasks+=(:app:assembleReceiptsRelease) && flavors="receipts"
          [ "$BANK_SMS" = true ] && tasks+=(:app:assembleFullRelease) && flavors="$flavors full"
          [ "$OPERATOR" = true ] && tasks+=(:operator:assembleRelease)
          ./gradlew --no-daemon "${tasks[@]}" \
            -PrelayBaseUrl="$RELAY_BASE_URL" \
            -PrelayVersionName="$version" \
            -PrelayVersionCode="$((1000 + GITHUB_RUN_NUMBER))" 2>&1 | tee release.log
          rm -f "$RELAY_KEYSTORE_FILE"
          mkdir -p "$RUNNER_TEMP/out"
          for flavor in $flavors; do
            apk="app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | head -3
            # Each app is named after its job; the unversioned copy keeps the
            # landing page's releases/latest/download links working.
            base="relay-bank-sms"
            [ "$flavor" = receipts ] && base="relay-receipts"
            cp "$apk" "$RUNNER_TEMP/out/$base-$version.apk"
            cp "$apk" "$RUNNER_TEMP/out/$base.apk"
            name="$base-$version.apk"
            (cd "$RUNNER_TEMP/out" && sha256sum "$name" > "$name.sha256")
            cat "$RUNNER_TEMP/out/$name.sha256"
          done
          if [ "$OPERATOR" = true ]; then
            # Relay Operator: the portal as a phone app (its own app id).
            apk="operator/build/outputs/apk/release/operator-release.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | head -3
            cp "$apk" "$RUNNER_TEMP/out/relay-operator-$version.apk"
            cp "$apk" "$RUNNER_TEMP/out/relay-operator.apk"
            (cd "$RUNNER_TEMP/out" && sha256sum "relay-operator-$version.apk" > "relay-operator-$version.apk.sha256")
          fi
      - name: Report build errors
        if: failure()
        working-directory: android
        run: |
          grep -E "^e: |error:|FAILED|What went wrong" release.log 2>/dev/null | head -10 | while IFS= read -r line; do
            echo "::error title=release-build::${line}"
          done
      - name: Publish GitHub Release
        env:
          # Optional: a public repo (owner/name) and a token that can write to it,
          # so people without access to this private repo can download the APK.
          RELEASE_REPO: ${{ vars.RELAY_RELEASE_REPO || github.repository }}
          GH_TOKEN: ${{ secrets.RELAY_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          tag="agent-v$APP_VERSION"
          notes="Relay $APP_VERSION for Android 8.0 or newer."
          sha() { cut -d' ' -f1 "$RUNNER_TEMP/out/$1-$APP_VERSION.apk.sha256"; }
          if [ "$RECEIPTS" = true ]; then
            notes="$notes relay-receipts-$APP_VERSION.apk (Relay Receipts, no SMS access; SHA-256 $(sha relay-receipts))."
          fi
          if [ "$BANK_SMS" = true ]; then
            notes="$notes relay-bank-sms-$APP_VERSION.apk (Relay Bank SMS, for the phone that receives bank SMS; SHA-256 $(sha relay-bank-sms))."
          fi
          if [ "$OPERATOR" = true ]; then
            notes="$notes relay-operator-$APP_VERSION.apk (Relay Operator, the portal as a phone app; SHA-256 $(sha relay-operator))."
          fi
          # This commit only exists in this repo; a separate release repo tags its own default branch.
          target=()
          [ "$RELEASE_REPO" = "$GITHUB_REPOSITORY" ] && target=(--target "$GITHUB_SHA")
          if gh release view "$tag" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP"/out/* --repo "$RELEASE_REPO" --clobber
          else
            gh release create "$tag" "$RUNNER_TEMP"/out/* --repo "$RELEASE_REPO" \
              --title "Relay $APP_VERSION" --notes "$notes" "${target[@]}"
          fi
          # One fixed release per app keeps that app's newest APK at a stable
          # link for the landing page, since a release may leave an app out.
          keep() {
            local fixed="$1" file="$2" title="$3"
            local dir="$RUNNER_TEMP/fixed-$fixed"; mkdir -p "$dir"
            cp "$RUNNER_TEMP/out/$file" "$dir/$file"
            if gh release view "$fixed" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
              gh release edit "$fixed" --repo "$RELEASE_REPO" --title "$title $APP_VERSION" --latest=false
              gh release upload "$fixed" "$dir/$file" --repo "$RELEASE_REPO" --clobber
            else
              gh release create "$fixed" "$dir/$file" --repo "$RELEASE_REPO" \
                --title "$title $APP_VERSION" --notes "Latest $title." --latest=false "${target[@]}"
            fi
            echo "::notice title=$fixed::https://github.com/$RELEASE_REPO/releases/download/$tag/${file%.apk}-$APP_VERSION.apk"
          }
          [ "$RECEIPTS" = true ] && keep receipts-app relay-receipts.apk "Relay Receipts"
          [ "$BANK_SMS" = true ] && keep bank-sms relay-bank-sms.apk "Relay Bank SMS"
          [ "$OPERATOR" = true ] && keep operator-app relay-operator.apk "Relay Operator"
          true
