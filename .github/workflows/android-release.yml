name: Android release

# Builds the signed Relay Agent APKs (full with bank SMS, and receipts-only
# without SMS access) and publishes them as a GitHub Release.
# Start it by pushing a tag like agent-v0.5.0, or manually with a version.
on:
  push:
    tags: ["agent-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, e.g. 0.5.0"
        required: true
      bank_sms:
        description: "Also release Relay Bank SMS (rarely needed)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      # Relay Bank SMS updates are rare: built and offered only when asked.
      BANK_SMS: ${{ inputs.bank_sms && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release settings
        env:
          KEYSTORE: ${{ secrets.RELAY_KEYSTORE_BASE64 }}
          BASE_URL: ${{ vars.RELAY_BASE_URL }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing secret RELAY_KEYSTORE_BASE64;"
          [ -n "$BASE_URL" ] || missing="$missing variable RELAY_BASE_URL;"
          if [ -n "$missing" ]; then
            echo "::error title=release-settings::Missing:$missing see docs/android-release.md"
            exit 1
          fi
          case "$BASE_URL" in https://*/) ;; *)
            echo "::error title=release-settings::RELAY_BASE_URL must be an https origin ending with /"
            exit 1 ;;
          esac
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build signed APKs
        working-directory: android
        env:
          RELAY_KEYSTORE_BASE64: ${{ secrets.RELAY_KEYSTORE_BASE64 }}
          RELAY_KEYSTORE_PASSWORD: ${{ secrets.RELAY_KEYSTORE_PASSWORD }}
          RELAY_KEY_ALIAS: ${{ secrets.RELAY_KEY_ALIAS }}
          RELAY_KEY_PASSWORD: ${{ secrets.RELAY_KEY_PASSWORD }}
          RELAY_BASE_URL: ${{ vars.RELAY_BASE_URL }}
        run: |
          set -euo pipefail
          version="${VERSION#agent-v}"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          export RELAY_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          printf '%s' "$RELAY_KEYSTORE_BASE64" | base64 --decode > "$RELAY_KEYSTORE_FILE"
          chmod +x gradlew
          tasks=(:app:assembleReceiptsRelease :operator:assembleRelease)
          flavors="receipts"
          if [ "$BANK_SMS" = true ]; then tasks+=(:app:assembleFullRelease); flavors="full receipts"; fi
          ./gradlew --no-daemon "${tasks[@]}" \
            -PrelayBaseUrl="$RELAY_BASE_URL" \
            -PrelayVersionName="$version" \
            -PrelayVersionCode="$((1000 + GITHUB_RUN_NUMBER))" 2>&1 | tee release.log
          rm -f "$RELAY_KEYSTORE_FILE"
          mkdir -p "$RUNNER_TEMP/out"
          for flavor in $flavors; do
            apk="app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | head -3
            # Each app is named after its job; the unversioned copy keeps the
            # landing page's releases/latest/download links working.
            base="relay-bank-sms"
            [ "$flavor" = receipts ] && base="relay-receipts"
            cp "$apk" "$RUNNER_TEMP/out/$base-$version.apk"
            cp "$apk" "$RUNNER_TEMP/out/$base.apk"
            name="$base-$version.apk"
            (cd "$RUNNER_TEMP/out" && sha256sum "$name" > "$name.sha256")
            cat "$RUNNER_TEMP/out/$name.sha256"
          done
          # Relay Operator: the portal as a phone app (its own app id).
          apk="operator/build/outputs/apk/release/operator-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | head -3
          cp "$apk" "$RUNNER_TEMP/out/relay-operator-$version.apk"
          cp "$apk" "$RUNNER_TEMP/out/relay-operator.apk"
          (cd "$RUNNER_TEMP/out" && sha256sum "relay-operator-$version.apk" > "relay-operator-$version.apk.sha256")
      - name: Report build errors
        if: failure()
        working-directory: android
        run: |
          grep -E "^e: |error:|FAILED|What went wrong" release.log 2>/dev/null | head -10 | while IFS= read -r line; do
            echo "::error title=release-build::${line}"
          done
      - name: Publish GitHub Release
        env:
          # Optional: a public repo (owner/name) and a token that can write to it,
          # so people without access to this private repo can download the APK.
          RELEASE_REPO: ${{ vars.RELAY_RELEASE_REPO || github.repository }}
          GH_TOKEN: ${{ secrets.RELAY_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          tag="agent-v$APP_VERSION"
          rsha=$(cut -d' ' -f1 "$RUNNER_TEMP/out/relay-receipts-$APP_VERSION.apk.sha256")
          notes="Relay $APP_VERSION for Android 8.0 or newer. relay-receipts-$APP_VERSION.apk (Relay Receipts): receipts only, no SMS access (SHA-256 $rsha). relay-operator-$APP_VERSION.apk (Relay Operator): the operator portal as a phone app."
          if [ "$BANK_SMS" = true ]; then
            sha=$(cut -d' ' -f1 "$RUNNER_TEMP/out/relay-bank-sms-$APP_VERSION.apk.sha256")
            notes="$notes relay-bank-sms-$APP_VERSION.apk (Relay Bank SMS): for the phone that receives bank SMS (SHA-256 $sha)."
          else
            notes="$notes Relay Bank SMS is unchanged in this release."
          fi
          # This commit only exists in this repo; a separate release repo tags its own default branch.
          target=()
          [ "$RELEASE_REPO" = "$GITHUB_REPOSITORY" ] && target=(--target "$GITHUB_SHA")
          if gh release view "$tag" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP"/out/* --repo "$RELEASE_REPO" --clobber
          else
            gh release create "$tag" "$RUNNER_TEMP"/out/* --repo "$RELEASE_REPO" \
              --title "Relay Agent $APP_VERSION" --notes "$notes" "${target[@]}"
          fi
          if [ "$BANK_SMS" = true ]; then
            # A fixed "bank-sms" release keeps the latest Relay Bank SMS for the
            # landing page, since most releases leave it out.
            bank="$RUNNER_TEMP/bank"; mkdir -p "$bank"
            cp "$RUNNER_TEMP/out/relay-bank-sms.apk" "$bank/relay-bank-sms.apk"
            if gh release view bank-sms --repo "$RELEASE_REPO" >/dev/null 2>&1; then
              gh release edit bank-sms --repo "$RELEASE_REPO" --title "$APP_VERSION" --latest=false
              gh release upload bank-sms "$bank/relay-bank-sms.apk" --repo "$RELEASE_REPO" --clobber
            else
              gh release create bank-sms "$bank/relay-bank-sms.apk" --repo "$RELEASE_REPO" \
                --title "$APP_VERSION" --notes "Latest Relay Bank SMS." --latest=false "${target[@]}"
            fi
            echo "::notice title=apk::https://github.com/$RELEASE_REPO/releases/download/$tag/relay-bank-sms-$APP_VERSION.apk"
            echo "::notice title=sha256::$sha"
          fi
          echo "::notice title=apk-receipts::https://github.com/$RELEASE_REPO/releases/download/$tag/relay-receipts-$APP_VERSION.apk"
          echo "::notice title=apk-operator::https://github.com/$RELEASE_REPO/releases/download/$tag/relay-operator-$APP_VERSION.apk"
          echo "::notice title=sha256-receipts::$rsha"
