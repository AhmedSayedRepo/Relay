[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-backend"
version = "0.6.0"
description = "Relay standalone receipt processing platform: Sprint 6"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy[asyncio]>=2.0.38,<2.1",
  "asyncpg>=0.30,<1", "alembic>=1.14,<2", "PyJWT>=2.10,<3",
  "argon2-cffi>=23.1,<26", "email-validator>=2.2,<3", "cryptography>=44,<47",
  "Pillow>=12.3,<13", "openpyxl>=3.1.5,<4",
  "opencv-python-headless==4.12.0.88", "numpy==2.2.6",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1",
  "aiosqlite>=0.20,<1", "ruff>=0.9,<1", "black>=25.1,<27",
  "mypy>=1.15,<2", "build>=1.2,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"relay.infrastructure" = ["receipt_profiles/*.json", "receipt_profiles/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
  "postgres: uses only explicitly configured disposable TEST_POSTGRES_URL",
  "ocr_runtime: uses explicit local Tesseract and language-pack paths",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# HTML/CSS templates and page-structure regexes in the static-site generator.
"site/*.py" = ["E501"]
# Kaggle training script: long tensor/config lines read better unwrapped.
"training/*" = ["E501"]

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "openpyxl.*"]
ignore_missing_imports = true
